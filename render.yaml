services:
  - type: web
    name: olympiavn
    runtime: node
    plan: free
    region: singapore
    autoDeploy: true
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.12.0
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
